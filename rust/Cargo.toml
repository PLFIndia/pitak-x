[package]
name = "pitak_crypto"
version = "0.1.0"
edition = "2021"
# GPL-3.0-or-later matches the repo-root LICENSE and the F-Droid recipe
# (architecture.md A1). cargo-deny (added in A3) checks the whole crate
# graph against this allow-list automatically.
license = "GPL-3.0-or-later"
# MSRV pin (architecture.md A3): fails closed on an older toolchain, mirroring
# the Flutter pin in .fvmrc. CI installs exactly this toolchain.
rust-version = "1.96"
description = "Trusted crypto + vault core for Pitaka (Argon2id/AES-GCM blob unwrap + SQLCipher borrowers vault). Secrets never cross FFI."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
argon2 = "0.5"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"
base64 = "0.22"

[dependencies.rusqlite]
version = "0.32"
features = ["bundled-sqlcipher-vendored-openssl"]

[dependencies.libsqlite3-sys]
version = "0.30"
features = ["bundled-sqlcipher-vendored-openssl"]

[dev-dependencies]
# Property tests for the parse/unwrap surface (architecture.md B3, D5):
# stable toolchain, actively maintained, dev-only (never linked into the
# shipped library).
proptest = "1"
