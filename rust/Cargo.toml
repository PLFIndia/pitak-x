[package]
name = "pitak_crypto"
version = "0.1.0"
edition = "2021"
# GPL-3.0-or-later matches the repo-root LICENSE and the F-Droid recipe
# (LICENSE must match the F-Droid listing). cargo-deny (added in A3) checks the whole crate
# graph against this allow-list automatically.
license = "GPL-3.0-or-later"
# MSRV pin: fails closed on an older toolchain, mirroring
# the Flutter pin in .fvmrc. CI installs exactly this toolchain.
rust-version = "1.96"
description = "Trusted crypto + vault core for Pitaka (Argon2id/AES-GCM blob unwrap + SQLCipher borrowers vault). Secrets never cross FFI."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# Only `alloc` is needed for hash_password_into's internal block buffer. The
# vault does not use password-hash encoding or optional random-salt helpers.
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
aes-gcm = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"
base64 = "0.22"

# The SQLCipher of the borrowers vault (review finding P2-M4; decisions D73
# and D76 of PLAN.md). The C code that is compiled into the app follows from
# the two entries below: `libsqlite3-sys` 0.40 builds SQLCipher 4.20.0 on
# SQLite 3.54.1 from the crate `sqlcipher-src`, with OpenSSL (also built from
# source) for the cryptography. Three tests hold that in place: the linked
# versions and "a vault file is not readable as it lies on disk" in
# `src/vault.rs`, and the pin of `sqlcipher-src` in
# `tests/sqlcipher_source_pin.rs`.
#
# - BOTH entries name the feature `bundled-sqlcipher-vendored-openssl`, on
#   purpose. Each of them switches SQLCipher on by itself (`cargo tree -e
#   features -i libsqlite3-sys` shows both). If only one did, the vault's
#   encryption would hang on a single line of this file.
# - `default-features = false`: rusqlite's defaults are a statement cache
#   and a backend for web browsers. The vault uses neither.
# - `Cargo.lock` still names four crates that only a browser build would
#   use (`sqlite-wasm-rs`, `rsqlite-vfs`, `thiserror`, `thiserror-impl`). No
#   build of this app compiles them: `cargo tree --target all -i
#   sqlite-wasm-rs` prints nothing. One word of rusqlite's own SQLCipher
#   feature (`sqlite-wasm-rs?/sqlcipher`) makes cargo write them down. The
#   OSV scan reads the lock file, so an advisory against one of them turns
#   that job red although the app does not hold the code: look first.
[dependencies.rusqlite]
version = "0.43"
default-features = false
features = ["bundled-sqlcipher-vendored-openssl"]

# A direct dependency because `src/vault.rs` declares SQLCipher's
# `sqlite3_key` itself and needs the type `sqlite3` for it.
[dependencies.libsqlite3-sys]
version = "0.40"
features = ["bundled-sqlcipher-vendored-openssl"]

[dev-dependencies]
# Property tests for the parse/unwrap surface (hostile-input coverage):
# stable toolchain, actively maintained, dev-only (never linked into the
# shipped library).
proptest = "1"
