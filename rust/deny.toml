# cargo-deny configuration for pitak_crypto: advisories, licenses, bans, sources.
# One tool replaces cargo-audit: advisories + licenses + bans + sources.
# Policy intent: everything must be GPL-3.0-or-later compatible; unsound and
# unmaintained crates are ERRORS (the same policy `cargo audit --deny
# warnings` enforced before).

[advisories]
# Fetch the live RustSec advisory DB; an offline scan against a stale DB is
# not a clean bill of health. Vulnerabilities error by default.
db-urls = ["https://github.com/rustsec/advisory-db"]
# Unsound and unmaintained advisories fail the build — not warnings
# ("all" = deny for direct AND transitive crates).
unsound = "all"
unmaintained = "all"
yanked = "deny"
# No advisory is ignored today. An exception that is ever added here must be
# reviewed and TIME-BOXED: cargo-deny has no expiry field, so it is mirrored
# in `osv-scanner.toml` with `ignoreUntil`, and the OSV job fails CI again
# on that date. (The one for RUSTSEC-2026-0459 ended with the update to
# SQLCipher 4.20.0: docs/plans/sec-rustsec-2026-0459.md.)

[licenses]
# Allow-list: every license here is GPL-3.0-or-later compatible.
# OpenSSL 3 (bundled via rusqlite's vendored feature) is Apache-2.0;
# SQLCipher is BSD-style. Fonts (OFL) are assets, not crates.
# Exactly the licenses present in today's graph (cargo-deny warns on unused
# allowances, keeping this list honest). The OpenSSL C code that the crate
# `openssl-src` builds is Apache-2.0, which is GPL-3.0 compatible. The
# SQLCipher C code comes from the crate `sqlcipher-src`, which declares its
# licenses itself; the two of them that are not on this list are allowed for
# that crate alone, below.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "GPL-3.0-or-later",
]
# Confidence threshold for license-expression detection (default 0.8).
confidence-threshold = 0.8

# `sqlcipher-src` carries the C source of SQLCipher and declares
# `MIT AND BSD-3-Clause AND blessing AND WTFPL`. The two that the list above
# does not have are allowed for THIS crate only (decision D77 of PLAN.md), so
# that any other crate under one of them still needs a look:
# - `blessing` is SQLite's own notice in place of a license (SQLite is in
#   the public domain). SQLite has always been inside SQLCipher.
# - `WTFPL` is the license of libtomcrypt, which lies in the crate but is NOT
#   compiled into the app: the build uses OpenSSL (`libsqlcipher.a` holds no
#   libtomcrypt symbol; looked at on 2026-11-19).
# By the FSF's license list both are compatible with the GNU GPL.
[[licenses.exceptions]]
allow = ["blessing", "WTFPL"]
crate = "sqlcipher-src"

[[licenses.clarify]]
# allo-isolate (flutter_rust_bridge dep) declares no SPDX expression, only a
# license *file*; the file is verbatim Apache-2.0 (checked 2026-10-16).
name = "allo-isolate"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x9d231dc7 }]

[bans]
# One version of each crate in the SHIPPED graph; duplicates need a reviewed
# reason. cargo-deny's default `multiple-versions-include-dev = false` means
# duplicates that only dev-dependencies (proptest) pull in — rand_core, syn,
# getrandom, hashbrown, cpufeatures — are ignored on purpose: they are never
# linked into the library.
# (a duplicate transitive dep doubles the audit surface for that code).
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

# Exact, reviewed exceptions for Argon2 0.6's fixed digest chain. Argon2 uses
# digest 0.11 / block-buffer 0.12, while flutter_rust_bridge_macros still uses
# md-5 0.10 at compile time (including upstream's newest beta), and aes-gcm
# remains on the 0.10/0.2 chain. These skips allow only the named old version;
# they do not waive advisory, license, source, or wildcard checks.
[[bans.skip]]
name = "block-buffer"
version = "0.10.4"

[[bans.skip]]
name = "cpufeatures"
version = "0.2.17"

[[bans.skip]]
name = "crypto-common"
version = "0.1.7"

[[bans.skip]]
name = "digest"
version = "0.10.7"

[sources]
# crates.io only — no git or registry replacements sneak in unreviewed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
