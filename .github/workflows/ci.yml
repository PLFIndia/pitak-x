name: CI

# Continuous gates for the Kotlin->Flutter port (PLAN.md Step 9). Every push/PR
# must keep these green: the "zero data loss" migration matrix (Dart) + the
# hermetic vault crypto chain (Rust), plus analyze/format/test per AGENTS.md §11.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust core (pitak_crypto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the same Rust the F-Droid recipe uses (cargokit patch in
      # fdroiddata pins 1.96.0), so a green CI is predictive of the F-Droid build.
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Builds bundled-sqlcipher (OpenSSL + SQLCipher C) and runs the unit
      # tests + the HERMETIC vault fixture chain (Argon2id -> AES-GCM ->
      # sqlite3_key) against the committed synthetic fixture. No secrets.
      - name: cargo test (release)
        working-directory: rust
        run: cargo test --release
      # N14: advisory gate. Fails on any known vulnerability AND on warnings
      # (e.g. unsoundness advisories like RUSTSEC-2026-0190) — the explicit
      # warning policy astra-review.md asked for. Fetches the live advisory
      # DB (the stale offline scan in astra-review.md is NOT this gate).
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit (deny warnings)
        working-directory: rust
        run: cargo audit --deny warnings

  flutter:
    name: Flutter (analyze, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned via .fvmrc — the same file the F-Droid recipe extracts the
      # Flutter version from. One place to bump; CI and F-Droid stay in sync.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      # --enforce-lockfile mirrors the F-Droid recipe exactly: if pubspec.lock
      # was regenerated with a different Flutter than .fvmrc pins, this fails
      # here instead of on the F-Droid buildserver (root cause of the 1.1.5/1.1.6
      # update outage).
      - name: Resolve deps (lockfile must match pinned Flutter)
        run: flutter pub get --enforce-lockfile
      # Generated sources (drift/freezed/riverpod/json) must be regenerable and
      # leave no uncommitted diff (AGENTS.md §11 CI gate).
      - name: build_runner (no uncommitted diff)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet -- '*.g.dart' '*.freezed.dart'; then
            echo "::error::Generated files are stale; run build_runner and commit."
            git --no-pager diff --stat -- '*.g.dart' '*.freezed.dart'
            exit 1
          fi
      - name: Analyze (zero issues)
        run: flutter analyze lib test
      - name: Format check
        run: dart format --set-exit-if-changed lib test
      # Includes the migration matrix (all 25 book + 16 wishlist columns survive
      # restore) and the fail-closed restore/vault-mapping tests.
      - name: Test (with coverage)
        run: flutter test --coverage
      # N14: coverage RATCHET — total line coverage must not regress below
      # the floor. The repo target is >=90% for domain/application
      # (AGENTS.md §10); this whole-suite floor is the enforceable minimum
      # (presentation/infrastructure pull the total below the layer target).
      # Raise the floor as coverage improves; never lower it.
      - name: Coverage floor
        run: |
          python3 - <<'EOF'
          total = hit = 0
          for line in open('coverage/lcov.info'):
              if line.startswith('LF:'): total += int(line[3:])
              elif line.startswith('LH:'): hit += int(line[3:])
          pct = hit / total * 100 if total else 0.0
          floor = 64.0
          print(f'line coverage: {hit}/{total} = {pct:.2f}% (floor {floor}%)')
          if pct < floor:
              raise SystemExit('coverage fell below the floor')
          EOF
      # N14: lightweight secret scan over everything git tracks (no extra
      # tooling to supply-chain). Catches the common credential shapes; the
      # real protection remains AGENTS.md §12 (never commit secrets) +
      # review discipline.
      - name: Secret scan (tracked files)
        run: |
          ! git grep -nIE \
            'BEGIN (RSA|EC|OPENSSH|DSA|PGP) PRIVATE KEY' \
            'gh[pousr]_[A-Za-z0-9]{36,}' 'github_pat_[A-Za-z0-9_]{22,}' \
            'AKIA[0-9A-Z]{16}' 'xox[baprs]-[A-Za-z0-9-]{10,}' \
            -- ':!*.lock' ':!.github/workflows/*'
