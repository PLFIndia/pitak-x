name: CI

# Continuous gates for the Kotlin->Flutter port. Every push/PR
# must keep these green: the "zero data loss" migration matrix (Dart) + the
# hermetic vault crypto chain (Rust), plus analyze/format/test per AGENTS.md §11.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust core (pitak_crypto)
    runs-on: ubuntu-latest
    steps:
      # All actions are SHA-pinned with a version comment (architecture.md
      # A2); Dependabot's github-actions ecosystem updates both the SHA and
      # the comment. SHAs looked up at pin time, 2026-10-16.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Pinned to the same Rust the F-Droid recipe uses (cargokit patch in
      # fdroiddata pins 1.96.0), so a green CI is predictive of the F-Droid build.
      # (The 1.96.0 ref in this action is a branch; this is its head commit.)
      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
      # Rust gates at parity with Dart (architecture.md A3): format, lints,
      # supply-chain. Order matters: fmt is sub-second and fails fastest.
      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --check
      - name: cargo clippy (warnings = errors)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      # Builds bundled-sqlcipher (OpenSSL + SQLCipher C) and runs the unit
      # tests + the HERMETIC vault fixture chain (Argon2id -> AES-GCM ->
      # sqlite3_key) against the committed synthetic fixture. No secrets.
      - name: cargo test (release)
        working-directory: rust
        run: cargo test --release
      # Advisory + license + bans + sources gate (architecture.md D2: one
      # tool replaces cargo-audit). rust/deny.toml keeps the old
      # `--deny warnings` policy: unsound and unmaintained advisories are
      # errors. Fetches the live advisory DB; an offline scan against a
      # stale local DB is NOT a clean bill of health.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        working-directory: rust
        run: cargo deny check

  flutter:
    name: Flutter (analyze, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Pinned via .fvmrc — the same file the F-Droid recipe extracts the
      # Flutter version from. One place to bump; CI and F-Droid stay in sync.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      # --enforce-lockfile mirrors the F-Droid recipe exactly: if pubspec.lock
      # was regenerated with a different Flutter than .fvmrc pins, this fails
      # here instead of on the F-Droid buildserver (root cause of the 1.1.5/1.1.6
      # update outage).
      - name: Resolve deps (lockfile must match pinned Flutter)
        run: flutter pub get --enforce-lockfile
      # Generated sources (drift/freezed/riverpod/json) must be regenerable and
      # leave no uncommitted diff (AGENTS.md §11 CI gate). The tracked
      # .githooks/pre-commit runs this identical check locally before a commit
      # exists; keep the two in sync if either changes.
      - name: build_runner (no uncommitted diff)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet -- '*.g.dart' '*.freezed.dart'; then
            echo "::error::Generated files are stale; run build_runner and commit."
            git --no-pager diff --stat -- '*.g.dart' '*.freezed.dart'
            exit 1
          fi
      - name: Analyze (zero issues)
        run: flutter analyze lib test
      - name: Format check
        run: dart format --set-exit-if-changed lib test
      # Includes the migration matrix (all 25 book + 16 wishlist columns survive
      # restore) and the fail-closed restore/vault-mapping tests.
      - name: Test (with coverage)
        run: flutter test --coverage
      # N14: coverage RATCHET — total line coverage must not regress below
      # the floor. The repo target is >=90% for domain/application
      # (AGENTS.md §10); this whole-suite floor is the enforceable minimum
      # (presentation/infrastructure pull the total below the layer target).
      # Raise the floor as coverage improves; never lower it.
      - name: Coverage floor
        run: |
          python3 - <<'EOF'
          total = hit = 0
          for line in open('coverage/lcov.info'):
              if line.startswith('LF:'): total += int(line[3:])
              elif line.startswith('LH:'): hit += int(line[3:])
          pct = hit / total * 100 if total else 0.0
          floor = 64.0
          print(f'line coverage: {hit}/{total} = {pct:.2f}% (floor {floor}%)')
          if pct < floor:
              raise SystemExit('coverage fell below the floor')
          EOF
      # N14: lightweight secret scan over everything git tracks (no extra
      # tooling to supply-chain). Catches the common credential shapes; the
      # real protection remains AGENTS.md §12 (never commit secrets) +
      # review discipline.
      - name: Secret scan (tracked files)
        run: |
          ! git grep -nIE \
            'BEGIN (RSA|EC|OPENSSH|DSA|PGP) PRIVATE KEY' \
            'gh[pousr]_[A-Za-z0-9]{36,}' 'github_pat_[A-Za-z0-9_]{22,}' \
            'AKIA[0-9A-Z]{16}' 'xox[baprs]-[A-Za-z0-9-]{10,}' \
            -- ':!*.lock' ':!.github/workflows/*'

  # OSV vulnerability scan of BOTH lockfiles (architecture.md A2): Dart's
  # pubspec.lock is otherwise never scanned (cargo-deny covers only Rust).
  # Uses the project's reusable workflow, SHA-pinned like every other action.
  osv-scan:
    name: OSV scan (pubspec.lock + Cargo.lock)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # Scan the two committed lockfiles only (not a recursive repo walk).
      scan-args: |-
        --lockfile=pubspec.lock
        --lockfile=rust/Cargo.lock
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      contents: read

  # F-Droid purity gate (architecture.md A2/D3): the fdroid flavor must
  # never resolve a Google dependency. This is the automated form of
  # README.md › Flavors check 1, and it is NOT exempt for Dependabot PRs.
  # Dependency resolution does not trigger cargokit, so no Rust cross-compile
  # is needed; ubuntu-latest ships the Android SDK.
  fdroid-purity:
    name: F-Droid flavor purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - name: Resolve deps
        run: flutter pub get --enforce-lockfile
      - name: fdroidReleaseRuntimeClasspath is free of Google code
        working-directory: android
        run: |
          if ./gradlew :app:dependencies --configuration fdroidReleaseRuntimeClasspath \
              | grep -E 'com\.google\.android\.(play|gms)|firebase|mlkit'; then
            echo "::error::Google dependency leaked into the fdroid flavor."
            exit 1
          fi
          echo "fdroidReleaseRuntimeClasspath is clean."
