name: CI

# Continuous gates for the Kotlin->Flutter port. Every push/PR
# must keep these green: the "zero data loss" migration matrix (Dart) + the
# hermetic vault crypto chain (Rust), plus analyze/format/test per AGENTS.md §11.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust core (pitak_crypto)
    runs-on: ubuntu-latest
    steps:
      # All actions are SHA-pinned with a version comment (docs/ARCHITECTURE.md
      # A2); Dependabot's github-actions ecosystem updates both the SHA and
      # the comment. SHAs looked up at pin time, 2026-10-16.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Pinned to the same Rust the F-Droid recipe uses (cargokit patch in
      # fdroiddata pins 1.96.0), so a green CI is predictive of the F-Droid build.
      # (The 1.96.0 ref in this action is a branch; this is its head commit.)
      # The action installs the MINIMAL profile, which has neither rustfmt
      # nor clippy — the A3 gates below need both listed explicitly.
      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
        with:
          components: rustfmt, clippy
      # Pins are COMMIT SHAs (v2.9.2 is an annotated tag; its tag-object SHA
      # 63fed3e2… is a different object — resolve with `git rev-parse v2.9.2^{commit}`).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      # Rust gates at parity with the Dart ones: format, lints,
      # supply-chain. Order matters: fmt is sub-second and fails fastest.
      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --check
      - name: cargo clippy (warnings = errors)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      # Builds bundled-sqlcipher (OpenSSL + SQLCipher C) and runs the unit
      # tests + the HERMETIC vault fixture chain (Argon2id -> AES-GCM ->
      # sqlite3_key) against the committed synthetic fixture. No secrets.
      - name: cargo test (release)
        working-directory: rust
        run: cargo test --release
      # Advisory + license + bans + sources gate (Dependabot must not bypass the purity check: one
      # tool replaces cargo-audit). rust/deny.toml keeps the old
      # `--deny warnings` policy: unsound and unmaintained advisories are
      # errors. Fetches the live advisory DB; an offline scan against a
      # stale local DB is NOT a clean bill of health.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        working-directory: rust
        run: cargo deny check

  flutter:
    name: Flutter (analyze, format, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The viewer regressions execute the real inline JavaScript with Node.
      # Provision the LTS explicitly instead of relying on the runner image.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Pinned via .fvmrc — the same file the F-Droid recipe extracts the
      # Flutter version from. One place to bump; CI and F-Droid stay in sync.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      # --enforce-lockfile mirrors the F-Droid recipe exactly: if pubspec.lock
      # was regenerated with a different Flutter than .fvmrc pins, this fails
      # here instead of on the F-Droid buildserver (root cause of the 1.1.5/1.1.6
      # update outage).
      - name: Resolve deps (lockfile must match pinned Flutter)
        run: flutter pub get --enforce-lockfile
      # Generated sources (drift/freezed/riverpod/json) must be regenerable and
      # leave no uncommitted diff (AGENTS.md §11 CI gate). The tracked
      # .githooks/pre-commit runs this identical check locally before a commit
      # exists; keep the two in sync if either changes.
      - name: build_runner (no uncommitted diff)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet -- '*.g.dart' '*.freezed.dart'; then
            echo "::error::Generated files are stale; run build_runner and commit."
            git --no-pager diff --stat -- '*.g.dart' '*.freezed.dart'
            exit 1
          fi
      - name: Analyze (zero issues)
        # integration_test is included so an API change in lib cannot leave
        # the on-device smoke test uncompilable unnoticed (found in the 2026-10 network review).
        run: flutter analyze lib test integration_test
      - name: Format check
        run: dart format --set-exit-if-changed lib test integration_test
      # L6: exercise the actual release files and the Unicode/boundary cases.
      - name: Fastlane changelog character limit
        run: |
          python3 tool/check_fastlane_changelog_chars.py 31
          python3 -m unittest discover -s tool -p 'test_check_fastlane_changelog_chars.py'
      # Includes the migration matrix (all 25 book + 16 wishlist columns survive
      # restore) and the fail-closed restore/vault-mapping tests. Goldens run
      # in their own step below so a renderer mismatch is never mistaken for
      # a logic failure (and never hides one).
      - name: Test (with coverage)
        run: flutter test --coverage --exclude-tags golden
      - name: Calendar-day regressions (two host timezones)
        # One ordered list, expanded by BOTH runs, so the two timezone matrices
        # cannot drift apart. Every entry holds a date that a host timezone can
        # reinterpret: local calendar days, issue dates and the published
        # issue-date round trip (codec → native detail → publish contract).
        run: |
          TZ_TARGETS="\
            test/features/library/domain/value_objects/calendar_date_test.dart \
            test/features/library/domain/catalogue_item_validated_test.dart \
            test/features/periodicals/domain \
            test/features/periodicals/application/add_issue_use_case_test.dart \
            test/features/network/infrastructure/published_catalogue_codec_test.dart \
            test/features/network/presentation/published_catalogue_item_page_test.dart \
            test/features/publish/published_catalogue_contract_test.dart"
          TZ=Asia/Calcutta flutter test $TZ_TARGETS
          TZ=America/New_York flutter test $TZ_TARGETS
      # N14: coverage RATCHET — total line coverage must not regress below
      # the floor. The repo target is >=90% for domain/application
      # (AGENTS.md §10); this whole-suite floor is the enforceable minimum
      # (presentation/infrastructure pull the total below the layer target).
      # Raise the floor as coverage improves; never lower it.
      - name: Coverage floor
        run: |
          python3 - <<'EOF'
          total = hit = 0
          for line in open('coverage/lcov.info'):
              if line.startswith('LF:'): total += int(line[3:])
              elif line.startswith('LH:'): hit += int(line[3:])
          pct = hit / total * 100 if total else 0.0
          floor = 64.0
          print(f'line coverage: {hit}/{total} = {pct:.2f}% (floor {floor}%)')
          if pct < floor:
              raise SystemExit('coverage fell below the floor')
          EOF
      # N14: lightweight secret scan over everything git tracks (no extra
      # tooling to supply-chain). Catches the common credential shapes; the
      # real protection remains AGENTS.md §12 (never commit secrets) +
      # review discipline.
      #
      # FAIL CLOSED (AGENTS §2.7). Each pattern needs its own `-e`: without
      # it, `git grep` reads the second and later patterns as REVISIONS and
      # dies with "fatal: unable to resolve revision" (exit 128) — which a
      # bare `!` turned into a pass, so this step had never scanned anything.
      # Exit codes are now handled explicitly: 1 = scanned and clean,
      # 0 = a match (fail), anything else = the scan did not run (fail).
      - name: Secret scan (tracked files)
        run: |
          set +e
          git grep -nIE \
            -e 'BEGIN (RSA|EC|OPENSSH|DSA|PGP) PRIVATE KEY' \
            -e 'gh[pousr]_[A-Za-z0-9]{36,}' -e 'github_pat_[A-Za-z0-9_]{22,}' \
            -e 'AKIA[0-9A-Z]{16}' -e 'xox[baprs]-[A-Za-z0-9-]{10,}' \
            -- ':!*.lock' ':!.github/workflows/*'
          status=$?
          set -e
          case "${status}" in
            1) echo "secret scan clean." ;;
            0) echo "::error::secret-shaped string found in tracked files (see matches above)."; exit 1 ;;
            *) echo "::error::git grep failed (exit ${status}) — the secret scan did not run."; exit 1 ;;
          esac
      # Golden comparison (golden tests are rendered on Linux CI): THIS runner is the
      # reference renderer. The committed PNGs must come from the
      # `update-goldens` workflow (ubuntu-latest), never from a Mac — macOS
      # rasterises differently, and a red step here with green logic tests
      # means exactly that: regenerate on Linux, commit, re-run.
      # LAST on purpose: a failing step skips everything after it, and a
      # renderer mismatch must never hide the coverage floor or secret scan.
      - name: Golden tests (Linux is the reference renderer)
        run: flutter test --tags golden

  # OSV vulnerability scan of BOTH lockfiles (supply chain: pinned actions + Dependabot): Dart's
  # pubspec.lock is otherwise never scanned (cargo-deny covers only Rust).
  # Uses the project's reusable workflow, SHA-pinned like every other action.
  osv-scan:
    name: OSV scan (pubspec.lock + Cargo.lock)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # Scan the two committed lockfiles only (not a recursive repo walk).
      scan-args: |-
        --lockfile=pubspec.lock
        --lockfile=rust/Cargo.lock
      upload-sarif: false
      fail-on-vuln: true
    # A caller can only DOWNGRADE a reusable workflow's permissions, and
    # GitHub rejects the job outright ("nested job is requesting X but is only
    # allowed none") if the called job declares more than the caller grants.
    # The called job declares exactly these three (its SARIF-upload step needs
    # security-events; we switch that step off above, but the declaration is
    # static). This is the set the OSV docs prescribe for the reusable
    # workflow — the GITHUB_TOKEN is still scoped to this one job.
    permissions:
      actions: read
      contents: read
      security-events: write

  # F-Droid purity gate (supply chain: Dependabot must not break F-Droid purity): the fdroid flavor must
  # never resolve a Google dependency. This is the automated form of
  # docs/RELEASING.md §2 check 1, and it is NOT exempt for Dependabot PRs.
  # Dependency resolution does not trigger cargokit, so no Rust cross-compile
  # is needed; ubuntu-latest ships the Android SDK.
  fdroid-purity:
    name: F-Droid flavor purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - name: Resolve deps
        run: flutter pub get --enforce-lockfile
      # `android/gradlew` and `gradle-wrapper.jar` are git-ignored (Flutter's
      # template); the Flutter tool injects them from the SDK on every build.
      # `--config-only` runs exactly that injection (plus local.properties)
      # and stops before compiling anything — the first run of the
      # fail-closed gate below caught their absence (exit 127, "command not
      # found"), which the old fail-open form would have reported as "clean".
      - name: Generate the Gradle wrapper the way a real build does
        run: flutter build apk --config-only --flavor fdroid
      # FAIL CLOSED (AGENTS §2.7). The naive form
      #   if ./gradlew … | grep PATTERN; then fail; fi
      # passes whenever Gradle itself fails (no output → grep matches nothing
      # → "clean"), so a broken SDK, a renamed configuration or a typo would
      # silently turn the gate green. Instead: (1) capture the report, letting
      # `set -e` abort on a Gradle failure; (2) refuse an empty report;
      # (3) only then grep it.
      - name: fdroidReleaseRuntimeClasspath is free of Google code
        working-directory: android
        env:
          PATTERN: 'com\.google\.android\.(play|gms)|firebase|mlkit'
        run: |
          report="$(./gradlew --quiet :app:dependencies --configuration fdroidReleaseRuntimeClasspath)"
          if ! grep -q -- '--- ' <<<"${report}"; then
            echo "::error::The fdroid dependency report is empty — the gate checked nothing."
            exit 1
          fi
          if grep -E "${PATTERN}" <<<"${report}"; then
            echo "::error::Google dependency leaked into the fdroid flavor."
            exit 1
          fi
          echo "fdroidReleaseRuntimeClasspath is clean."
      # POSITIVE CONTROL: the play flavor legitimately contains Google code
      # (README › Flavors). If this step cannot find it, the grep or the
      # Gradle invocation is broken and the step above proved nothing. This
      # is the automated, every-run form of the plan's one-off "point it at
      # the play classpath and watch it fail" proof (supply chain: pinned actions + Dependabot).
      - name: Positive control — playReleaseRuntimeClasspath DOES contain Google code
        working-directory: android
        env:
          PATTERN: 'com\.google\.android\.(play|gms)|firebase|mlkit'
        run: |
          report="$(./gradlew --quiet :app:dependencies --configuration playReleaseRuntimeClasspath)"
          if ! grep -qE "${PATTERN}" <<<"${report}"; then
            echo "::error::The play classpath shows no Google code — the purity check itself is broken."
            exit 1
          fi
          echo "positive control OK: the play flavor resolves Google code, so the fdroid check is live."
