name: Update goldens

# Regenerates the golden PNGs on the REFERENCE renderer (Linux —
# golden tests are rendered on Linux CI: macOS rasterises text differently, so locally
# generated goldens would flicker red on CI).
#
# Two ways to get fresh PNGs:
#  1. Automatically: any pull request that touches the golden tests runs
#     this and attaches a `goldens` artefact to the run. (The "Run workflow"
#     button only exists once this file is on `main`, so without this
#     trigger the very first PR that adds goldens could never produce them.)
#  2. By hand: Actions tab → "Update goldens" → "Run workflow" on any branch.
# Either way: download the `goldens` artefact, copy its PNGs over
# test/golden/goldens/, commit, push. Never commit PNGs made on a Mac.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/golden/**'

# Read-only token: this workflow only renders and uploads an artefact.
permissions:
  contents: read

jobs:
  update-goldens:
    name: Regenerate golden PNGs (Linux reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - name: Resolve deps
        run: flutter pub get --enforce-lockfile
      - name: flutter test --update-goldens --tags golden
        run: flutter test --update-goldens --tags golden
      - name: Upload goldens artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goldens
          path: test/golden/goldens/
