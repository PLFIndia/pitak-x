<!doctype html>
<!--
  Pitaka library viewer (D12).
  Single self-contained file: no CDN dependencies, no build step,
  no runtime fetch beyond its same-origin siblings: books.json,
  availability.json (v8) and a HEAD probe of events.html (v6).

  Bundled with the app at app/src/main/assets/publish/index.html
  and uploaded verbatim to the user's GitHub repo on publish.

  viewerVersion: 8
    v3: F-09 — Content-Security-Policy meta added; image origins
         restricted to same-origin, data:, and the OpenLibrary /
         Google Books cover hosts. Mirrors CoverUrlAllowList.kt.
    v4: genre + language filter facets (populated from books.json);
         coarse availability badge ("Available" / "All out", renamed
         "Not available" in v8) rendered when the publisher included it
         (vault unlocked at publish time).
         Availability is a coarse status only — never an exact count.
    v5 (Revision R): genre dropped as a dropdown — now matched via the
         search box (title/author/genre). Sort options are Recently added /
         Language / Age group. Language stays a filter dropdown. Age group
         renders as a small badge and is a sort key (ordinal order).
    v6: library info line restyled as a bordered card (address + GPS now
         distinct entries, fed by the split Contribute fields). Eyeball-catching
         events banner added under the title — hidden by default, revealed by a
         same-origin HEAD probe of events.html (the two pages publish
         independently), linking to the Events page when it exists.
    v7: item kinds (ADR 0014 W3) — fixed kind facet (All kinds · Books ·
         Magazines · Others); magazine issues group under their series
         (from the additive top-level periodicals[]) with Issue /
         Bound volume / Other badges; an unknown kind renders as a plain
         item. books.json stays schema 1: older viewers ignore the new
         keys, and this viewer reads them defensively on older payloads.
         (The stale "viewerVersion: 4" line was bumped to match — v5/v6
         landed without bumping it.)
    v8: availability file (ADR 0019 Decision 4 + its S7 clarification,
         plan C.7). The app keeps a small sibling availability.json
         ({"schemaVersion":1,"keySet":…,"asOf":…,"out":[keys]}) up to date
         after loans and returns, without republishing books.json. This
         viewer requests it at the same time as books.json and asks again
         every 60 s while the page is visible (and once when the tab
         becomes visible again), always with cache: "no-cache" so the
         browser revalidates its saved copy — never a ?query cache-buster
         (GitHub's edge ignores query strings).
         The file is untrusted. More than 1 MiB, invalid UTF-8, nesting
         deeper than 16, not a JSON object, a newer schemaVersion, a bad
         keySet, or one bad key in "out" makes the viewer ignore the WHOLE
         file, exactly as if it were missing (404). It is used only when
         its keySet equals the keySet at the top of books.json: a file left
         by another install would otherwise match no key and mark every
         item Available.
         The tag, per item (availabilityTag): a book or magazine issue with
         a valid key is "Not available" when its key is in "out", else
         "Available"; any other book or issue keeps its inline tag from
         books.json, if any. Kind Other and unknown kinds never show a tag
         (the native viewer's rule, plan J7). Labels are Available /
         Not available ("All out" retired). New: an "Available now"
         checkbox that keeps only Available items, and a summary line
         "N of M available · updated <time>" (the time only when asOf is
         plausible). The CSP is unchanged: connect-src 'self' already
         allows the request.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<!--
  F-09: Content-Security-Policy.
  default-src 'self' is the catch-all deny; everything else is an
  explicit grant. img-src mirrors CoverUrlAllowList.allowedHosts (+
  the *.us.archive.org wildcard for CoverUrlAllowList.archiveNodePattern:
  Open Library redirects about half of its covers through archive.org to
  ia<digits>.us.archive.org storage nodes, D-3); any drift between the
  list and this header is caught by viewer_csp_lockstep_test.dart.
  'unsafe-inline' on script/style is honest:
  the viewer is a single self-contained file built around inline
  <style> and <script>. It does not protect against XSS in this
  document, but the F-09 threat is cross-origin image exfiltration,
  which img-src handles regardless of script-src.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://covers.openlibrary.org https://books.google.com https://books.googleusercontent.com https://archive.org https://*.us.archive.org; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
<title>{{LIBRARY_NAME}}</title>
<style>
  :root {
    --saffron-50: #fff1e6;
    --saffron-100: #fac7a7;
    --saffron-400: #e25822;
    --saffron-700: #7e2706;
    --ink-50: #fffaf5;
    --ink-900: #1f1209;
    --grey-30: #e5e5e5;
    --grey-70: #424242;
    --bg: var(--ink-50);
    --bg-alt: var(--saffron-50);
    --fg: var(--ink-900);
    --fg-muted: var(--grey-70);
    --accent: var(--saffron-400);
    --border: var(--grey-30);
    --shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  [data-theme="dark"] {
    --bg: #1a1208;
    --bg-alt: #2a1c10;
    --fg: var(--ink-50);
    --fg-muted: var(--saffron-100);
    --border: #3a2a1a;
    --shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  h1 { margin: 0 0 12px; font-size: 22px; font-weight: 500; color: var(--accent); display: flex; align-items: center; gap: 10px; }
  h1 .logo { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
  /* Optional library info line (rendered only when the publisher set at least
     one of address/GPS/email/phone). Sits under the title, above the controls.
     Muted, tappable links; wraps on narrow screens. */
  .contact {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin: -4px 0 12px;
    font-size: 13px;
    padding: 8px 12px;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .contact .contact-item {
    color: var(--fg-muted);
    text-decoration: none;
    white-space: nowrap;
  }
  .contact .contact-item:hover { color: var(--accent); text-decoration: underline; }
  /* Eyeball-catching events banner. Hidden by default; revealed by script only
     when a sibling events.html exists (the two pages publish independently, so
     index.html cannot know at build time whether events was ever published). */
  .events-banner {
    display: none;
    align-items: center;
    gap: 12px;
    margin: 0 0 12px;
    padding: 10px 14px;
    background: var(--accent);
    color: var(--ink-50);
    border-radius: 8px;
    text-decoration: none;
  }
  .events-banner.show { display: flex; }
  .events-banner .bell { font-size: 20px; flex-shrink: 0; }
  .events-banner .txt { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; }
  .events-banner .go {
    font-size: 13px; font-weight: 600; white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.6); border-radius: 999px; padding: 3px 12px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  input[type="search"], select, button {
    font: inherit;
    border: 1px solid var(--border);
    background: var(--bg-alt);
    color: var(--fg);
    padding: 6px 10px;
    border-radius: 6px;
  }
  input[type="search"] { flex: 1; min-width: 180px; }
  button { cursor: pointer; }
  button.active { background: var(--accent); color: var(--ink-50); border-color: var(--accent); }
  .meta { color: var(--fg-muted); font-size: 12px; margin: 8px 0 0; }
  /* Coarse availability badges (v4; v8 labels). Only "Available" / "Not available" — never a count. */
  .avail { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 999px; white-space: nowrap; }
  .avail-available { background: #1b5e2022; color: #1b5e20; border: 1px solid #1b5e2055; }
  .avail-out { background: #b0002022; color: #b00020; border: 1px solid #b0002055; }
  .avail-age { background: #1565c022; color: #1565c0; border: 1px solid #1565c055; }
  [data-theme="dark"] .avail-available { color: #7fdf95; }
  [data-theme="dark"] .avail-out { color: #ff8a80; }
  [data-theme="dark"] .avail-age { color: #90caf9; }
  /* Kind badges (v7): Issue / Bound volume / Other. Neutral next to the
     availability colours; books — and kinds this viewer does not know —
     carry no badge (W3). */
  .avail-kind { color: var(--fg-muted); border: 1px solid var(--border); }
  /* Series group headers (v7): issues group under their magazine title.
     In the card/grid layouts the header spans the whole grid row. */
  .series-head { grid-column: 1 / -1; margin: 18px 0 2px; font-size: 16px; font-weight: 600; }
  .series-head .meta, .series-row .meta { font-weight: 400; }
  .series-row td { padding-top: 14px; font-weight: 600; }
  /* "Available now" filter (v8): a plain checkbox with its text, sized like
     the other controls. */
  .avail-filter { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; cursor: pointer; }
  .avail-filter input { margin: 0; accent-color: var(--accent); }
  /* Offered only while something is tagged (or it is still ticked); the
     display rule above would otherwise override the hidden attribute. */
  .avail-filter[hidden] { display: none; }
  /* Availability summary line (v8). Takes no space while it is empty
     (nothing tagged, or the catalogue is still loading). */
  #availSummary { margin-top: 2px; }
  #availSummary:empty { display: none; }
  main { padding: 16px 20px 48px; }

  /* Layouts */
  /* N12: wide tables scroll sideways on narrow screens instead of breaking
     the page layout. */
  .layout-table { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .layout-table table { width: 100%; border-collapse: collapse; }
  .layout-table th, .layout-table td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .layout-table th { font-weight: 600; color: var(--fg-muted); }

  .layout-card .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .layout-card .card {
    border: 1px solid var(--border);
    background: var(--bg-alt);
    border-radius: 8px;
    padding: 12px;
    box-shadow: var(--shadow);
  }
  .layout-card .card h3 { margin: 0 0 4px; font-size: 16px; }
  .layout-card .card .author { color: var(--fg-muted); font-size: 14px; }
  .layout-card .card .row { font-size: 12px; color: var(--fg-muted); margin-top: 4px; }

  .layout-grid .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }
  .layout-grid .grid figure {
    margin: 0;
    text-align: center;
  }
  .layout-grid .grid img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 4px;
    background: var(--bg-alt);
    border: 1px solid var(--border);
  }
  .layout-grid .grid figcaption {
    font-size: 12px;
    color: var(--fg-muted);
    margin-top: 4px;
    overflow-wrap: anywhere;
  }
  .layout-grid .grid .title { color: var(--fg); }

  .empty {
    color: var(--fg-muted);
    font-size: 14px;
    margin: 32px 0;
    text-align: center;
  }
  .error {
    color: #b00020;
    margin: 32px 0;
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <h1 id="title">
    <img class="logo" id="logo" src="{{LOGO_DATA_URL}}" alt="" onerror="this.style.display='none'" />
    <span>{{LIBRARY_NAME}}</span>
  </h1>
  <a class="events-banner" id="eventsBanner" href="events.html">
    <span class="bell">📣</span>
    <span class="txt">See what's happening at the library</span>
    <span class="go">Events →</span>
  </a>
  {{CONTACT_HTML}}
  <div class="controls">
    <input id="q" type="search" placeholder="Search title, author, genre, ISBN" aria-label="Search the catalogue" autocomplete="off" />
    <select id="sort" aria-label="Sort books by">
      <option value="addedDate">Recently added</option>
      <option value="language">Language</option>
      <option value="ageGroup">Age group</option>
    </select>
    <select id="language" aria-label="Filter by language"><option value="">All languages</option></select>
    <!-- v7 kind facet (ADR 0013 U1/F3): kinds are app-defined and fixed, so
         the options are static HTML — unlike the data-driven language list. -->
    <select id="kind" aria-label="Filter by kind">
      <option value="">All kinds</option>
      <option value="book">Books</option>
      <option value="magazine-issue">Magazines</option>
      <option value="other">Others</option>
    </select>
    <!-- v8: keeps only items tagged Available (see availabilityTag). -->
    <label class="avail-filter" id="availFilter" hidden><input type="checkbox" id="availNow" /> Available now</label>
    <button data-layout="table" class="active" aria-label="Table layout" aria-pressed="true">Table</button>
    <button data-layout="card" aria-label="Card layout" aria-pressed="false">Cards</button>
    <button data-layout="grid" aria-label="Cover grid layout" aria-pressed="false">Covers</button>
    <button id="theme" title="Toggle dark mode" aria-label="Toggle dark mode">🌗</button>
  </div>
  <p class="meta" id="meta">Loading…</p>
  <p class="meta" id="availSummary"></p>
</header>
<main id="root"></main>

<script>
  const $ = (s) => document.querySelector(s);
  const root = $("#root");
  const q = $("#q");
  const sortEl = $("#sort");
  const languageEl = $("#language");
  const kindEl = $("#kind");
  const availNowEl = $("#availNow");
  const availFilterEl = $("#availFilter");
  const meta = $("#meta");
  const availSummaryEl = $("#availSummary");
  const theme = $("#theme");

  // ---- Theming ----
  const THEME_KEY = "pitaka-theme";
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    localStorage.setItem(THEME_KEY, t);
  }
  applyTheme(localStorage.getItem(THEME_KEY) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  theme.addEventListener("click", () => {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  // ---- Events banner (independent pages) ----
  // index.html and events.html publish separately, so the catalogue cannot know
  // at build time whether an events page exists. Probe for it; reveal the
  // banner only when present (CSP connect-src 'self' permits this same-origin
  // request). Any failure leaves the banner hidden — never a dead link.
  (function probeEvents() {
    fetch("events.html", { method: "HEAD", cache: "no-cache" })
      .then((res) => { if (res.ok) $("#eventsBanner").classList.add("show"); })
      .catch(() => {});
  })();

  // ---- Layout switcher ----
  let layout = "table";
  document.querySelectorAll("button[data-layout]").forEach((b) => {
    b.addEventListener("click", () => {
      layout = b.dataset.layout;
      document.querySelectorAll("button[data-layout]").forEach((x) => {
        x.classList.toggle("active", x === b);
        // N12: keep the pressed state truthful for assistive tech.
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      render();
    });
  });
  q.addEventListener("input", render);
  sortEl.addEventListener("change", render);
  languageEl.addEventListener("change", render);
  kindEl.addEventListener("change", render);
  availNowEl.addEventListener("change", render);

  // ---- Data ----
  let books = [];
  let periodicals = [];
  let loadError = null;
  // True once books.json has been read. The availability answer may arrive
  // first; render() waits for the catalogue instead of drawing an empty list.
  let catalogueLoaded = false;
  // v8: books.json's top-level keySet when it has the key shape, else null.
  // availability.json applies only to a catalogue with the SAME keySet.
  let catalogueKeySet = null;
  // True when books.json declares a newer schema than this viewer knows; the
  // notice stays in the meta line on every render (it used to be overwritten
  // by the item count at once).
  let newerSchema = false;

  async function load() {
    try {
      const res = await fetch("books.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (typeof data.schemaVersion !== "number") {
        throw new Error("Missing schemaVersion in books.json");
      }
      newerSchema = data.schemaVersion > 1;
      books = Array.isArray(data.books) ? data.books : [];
      // v7: additive key — absent on older payloads (or when the library
      // has no magazines); read defensively either way.
      periodicals = Array.isArray(data.periodicals) ? data.periodicals : [];
      // v8: additive key — absent on payloads from older Pitak builds; then
      // no availability.json can ever apply and inline tags are used.
      catalogueKeySet = isKey(data.keySet) ? data.keySet : null;
      catalogueLoaded = true;
      populateFacets();
      render();
    } catch (e) {
      loadError = e.message || String(e);
      root.innerHTML = '<div class="error">Failed to load books.json: ' + escape(loadError) + "</div>";
    }
  }

  function escape(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  // ---- Availability file (v8, ADR 0019 Decision 4) ----
  // availability.json lists the keys of items whose every copy is lent out.
  // It sits on a public site, so every byte is untrusted: the limits below
  // are the same ones the app's own (native) reader applies, and shared
  // test fixtures keep the two readers in step.
  const AVAILABILITY_MAX_BYTES = 1048576; // 1 MiB
  const AVAILABILITY_MAX_KEYS = 100000;
  const AVAILABILITY_MAX_DEPTH = 16;
  const AVAILABILITY_RECHECK_MS = 60000; // re-check once a minute
  const EARLIEST_PLAUSIBLE_AS_OF = 1577836800000; // 2020-01-01T00:00Z: no Pitak existed earlier
  const AS_OF_CLOCK_SKEW_MS = 86400000; // 24 h: allows a phone clock that runs ahead
  // The exact shape of a public key (and of a keySet): 16 lower-case hex
  // characters. No trimming, no case folding — a Pitak writer never emits
  // anything else. (No "g" flag: a global regex remembers its last match
  // position between test() calls, which would make answers alternate.)
  const KEY_PATTERN = /^[0-9a-f]{16}$/;

  // The last availability.json that passed every rule, or null (missing,
  // ignored, or not answered yet).
  let availabilityFile = null;
  // Counts started availability checks, so only the newest answer is used.
  let availabilityChecks = 0;

  function isKey(value) {
    return typeof value === "string" && KEY_PATTERN.test(value);
  }

  // Deepest {/[ nesting in JSON text, not counting brackets inside strings.
  // Mirrors the app's JsonNestingDepth.maxDepthOf
  // (lib/core/text/json_nesting_depth.dart) exactly, so both readers refuse
  // the same files. Why it exists: a recursive JSON parser can run out of
  // stack on a "[[[[…" bomb, so the text is measured BEFORE it is parsed.
  function jsonNestingDepth(text) {
    let depth = 0;
    let max = 0;
    let inString = false;
    let escaped = false;
    for (let i = 0; i < text.length; i++) {
      const c = text.charCodeAt(i);
      if (inString) {
        if (escaped) escaped = false;
        else if (c === 0x5c) escaped = true; // '\': the next character is escaped
        else if (c === 0x22) inString = false; // '"': the string ends here
        continue;
      }
      if (c === 0x22) {
        inString = true;
      } else if (c === 0x5b || c === 0x7b) { // '[' or '{'
        depth++;
        if (depth > max) max = depth;
      } else if (c === 0x5d || c === 0x7d) { // ']' or '}'
        if (depth > 0) depth--; // a stray closer never goes below zero
      }
    }
    return max;
  }

  // Reads the raw bytes (an ArrayBuffer) of availability.json.
  // Returns { keySet, asOf, out } when the file passes EVERY rule, or null,
  // which means "treat it exactly like a missing file". All or nothing on
  // purpose: skipping one bad key and keeping the rest would show that item
  // as Available — worse than showing the inline tag.
  // Pure: the same bytes always give the same answer. asOf is kept as it was
  // written (or null) and judged only when shown, because "plausible"
  // depends on the current time (see plausibleAsOf).
  function parseAvailability(buffer) {
    if (!buffer || typeof buffer.byteLength !== "number") return null;
    if (buffer.byteLength > AVAILABILITY_MAX_BYTES) return null;
    let data;
    try {
      // fatal: true makes invalid UTF-8 throw instead of turning into "�".
      const text = new TextDecoder("utf-8", { fatal: true }).decode(buffer);
      if (jsonNestingDepth(text) > AVAILABILITY_MAX_DEPTH) return null;
      data = JSON.parse(text);
    } catch (e) {
      // Invalid UTF-8 or invalid JSON: not an availability file. Ignoring
      // it IS the handling (the inline tags are shown instead).
      return null;
    }
    // The root must be a plain object ({…}); arrays and null are not.
    if (data === null || typeof data !== "object" || Array.isArray(data)) return null;
    const version = data.schemaVersion;
    if (!Number.isInteger(version) || version < 1) return null;
    // A newer format may give the same fields another meaning: don't guess.
    if (version > 1) return null;
    if (!isKey(data.keySet)) return null;
    const list = data.out;
    if (!Array.isArray(list) || list.length > AVAILABILITY_MAX_KEYS) return null;
    const out = new Set(); // a Set merges duplicate keys
    for (const key of list) {
      if (!isKey(key)) return null;
      out.add(key);
    }
    // Unknown fields are simply never read. asOf never refuses the file.
    return {
      keySet: data.keySet,
      asOf: Number.isInteger(data.asOf) ? data.asOf : null,
      out: out,
    };
  }

  // asOf when it is believable at nowMillis (not before 2020, at most 24 h
  // ahead of now), else null — and then no "updated" time is shown.
  function plausibleAsOf(asOf, nowMillis) {
    if (!Number.isInteger(asOf)) return null;
    if (asOf < EARLIEST_PLAUSIBLE_AS_OF) return null;
    if (asOf > nowMillis + AS_OF_CLOCK_SKEW_MS) return null;
    return asOf;
  }

  // The accepted file, but only when it belongs to THIS catalogue: both name
  // the same keySet (plan J10). A file computed with another install's keys
  // would match no item and wrongly show every item as Available.
  function boundAvailabilityFile() {
    if (availabilityFile === null || catalogueKeySet === null) return null;
    return availabilityFile.keySet === catalogueKeySet ? availabilityFile : null;
  }

  // THE per-item availability rule: "available", "out" or null (no tag).
  // Badge, "Available now" filter and summary all go through here, so they
  // can never disagree. The native viewer applies the same rule
  // (PublishedAvailabilityMerge).
  function availabilityTag(b) {
    if (!b || typeof b !== "object") return null;
    // Only an absent (or null) kind means "book" — like the native reader,
    // which treats any other unexpected value as an unknown kind.
    const kind = b.kind === undefined || b.kind === null ? "book" : b.kind;
    // Kind Other and kinds this viewer does not know never carry a tag, even
    // when the payload has one (plan J7).
    if (kind !== "book" && kind !== "magazine-issue") return null;
    const file = boundAvailabilityFile();
    if (file !== null && isKey(b.key)) return file.out.has(b.key) ? "out" : "available";
    // No usable file, or no valid key: the tag written into books.json.
    if (b.availability === "available" || b.availability === "out") return b.availability;
    return null;
  }

  // Counts over ALL items (not just the filtered ones) for the summary line:
  // tagged = items with any tag, available = items tagged "available".
  // asOf = the plausible asOf of the file in use, else null.
  function availabilitySummary() {
    let available = 0;
    let tagged = 0;
    for (const b of books) {
      const tag = availabilityTag(b);
      if (tag !== null) tagged++;
      if (tag === "available") available++;
    }
    const file = boundAvailabilityFile();
    const asOf = file === null ? null : plausibleAsOf(file.asOf, Date.now());
    return { available: available, tagged: tagged, asOf: asOf };
  }

  // "312 of 340 available · updated 2:05 pm" — or empty when nothing is
  // tagged. textContent (not innerHTML), so nothing in it can become markup.
  function renderAvailabilitySummary() {
    const summary = availabilitySummary();
    // Like the native viewer: "Available now" is offered only when an item
    // shows a tag, and stays while ticked so it can always be unticked.
    availFilterEl.hidden = summary.tagged === 0 && !availNowEl.checked;
    if (summary.tagged === 0) {
      availSummaryEl.textContent = "";
      return;
    }
    let text = `${summary.available} of ${summary.tagged} available`;
    if (summary.asOf !== null) text += " · updated " + updatedAtText(summary.asOf);
    availSummaryEl.textContent = text;
  }

  // The time in the visitor's own locale; the day is added when it is not
  // today ("1 Nov, 2:05 pm").
  function updatedAtText(asOf) {
    const when = new Date(asOf);
    const time = when.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    if (when.toDateString() === new Date().toDateString()) return time;
    return when.toLocaleDateString([], { day: "numeric", month: "short" }) + ", " + time;
  }

  // One request for availability.json. Never rejects; the answer is either
  //   { file: <parsed file or null> } — the server answered. null means the
  //       file is missing (404 or any other non-OK status) or broke a rule;
  //       both count as "no file";
  //   { unreachable: true } — the request itself failed (offline, dropped
  //       connection), so we learned nothing new about the file.
  // cache: "no-cache" lets the browser revalidate its saved copy (a cheap
  // "not modified" when nothing changed). Never a ?query cache-buster:
  // GitHub's edge ignores query strings.
  async function fetchAvailability() {
    try {
      const res = await fetch("availability.json", { cache: "no-cache" });
      if (!res.ok) return { file: null };
      return { file: parseAvailability(await res.arrayBuffer()) };
    } catch (e) {
      // fetch() or reading the body failed: a network problem, not an answer.
      return { unreachable: true };
    }
  }

  // True when two parsed files would show exactly the same tags and summary.
  function sameAvailabilityFile(a, b) {
    if (a === null || b === null) return a === b;
    if (a.keySet !== b.keySet || a.asOf !== b.asOf || a.out.size !== b.out.size) return false;
    for (const key of a.out) {
      if (!b.out.has(key)) return false;
    }
    return true;
  }

  // Loads (or re-loads) availability.json and updates the page.
  //  - A missing or ignored file drops the previous one: the inline tags
  //    from books.json are shown again.
  //  - A network error keeps whatever we had — nothing, on the first load.
  //  - Only a changed file rebuilds the list. An unchanged re-check (the
  //    usual case, every minute) refreshes just the summary line, so the
  //    list does not flicker and a visitor's text selection survives.
  async function checkAvailability() {
    const check = ++availabilityChecks;
    const answer = await fetchAvailability();
    // A slow, older request must never overwrite a newer answer.
    if (check !== availabilityChecks) return;
    if (answer.unreachable) return;
    const changed = !sameAvailabilityFile(availabilityFile, answer.file);
    availabilityFile = answer.file;
    if (changed) render();
    else if (catalogueLoaded && !loadError) renderAvailabilitySummary();
  }

  // Populate the language facet dropdown from the loaded data.
  // Distinct, case-insensitive, sorted; preserves the leading "All …" option.
  function populateFacets() {
    const seen = new Map(); // lowercase -> original
    for (const b of books) {
      const v = (b.language || "").trim();
      if (v && !seen.has(v.toLowerCase())) seen.set(v.toLowerCase(), v);
    }
    const values = [...seen.values()].sort((a, b) => a.localeCompare(b));
    languageEl.innerHTML = `<option value="">All languages</option>` +
      values.map((v) => `<option value="${escape(v)}">${escape(v)}</option>`).join("");
  }

  // Age-group sort rank (for sort) + label (for the badge). Mirrors the Kotlin
  // Book.AgeGroup enum: keyed on the stable token, ordered by sortRank. Legacy
  // tokens (pre-"above N") are accepted too so an older published JSON still
  // renders correctly after the app updates.
  const AGE_ORDER = {
    "above-3": 0, "above-6": 1, "above-10": 2, "above-15": 3, "advanced": 4,
    // Legacy fallbacks (old published files): map onto the closest new band.
    AGE_0_5: 0, AGE_6_10: 1, AGE_11_16: 2, ADVANCE: 4,
  };
  const AGE_LABEL = {
    "above-3": "Above 3", "above-6": "Above 6", "above-10": "Above 10",
    "above-15": "Above 15", "advanced": "Advanced",
    // Legacy fallbacks.
    AGE_0_5: "Above 3", AGE_6_10: "Above 6", AGE_11_16: "Above 10", ADVANCE: "Advanced",
  };

  // Coarse availability badge (v4; v8 labels and rule): "Available" /
  // "Not available", or nothing. The tag comes from availabilityTag(), the
  // one per-item rule.
  function availBadge(b) {
    const tag = availabilityTag(b);
    if (tag === "available") return ` <span class="avail avail-available">Available</span>`;
    if (tag === "out") return ` <span class="avail avail-out">Not available</span>`;
    return "";
  }

  // Age-group badge (v5). Shown when the book carries an age band.
  function ageBadge(b) {
    const label = AGE_LABEL[b.ageGroup];
    return label ? ` <span class="avail avail-age">${label}</span>` : "";
  }

  // Plain age-band label for the table's Age column (v6). Empty when unset.
  function ageText(b) {
    return AGE_LABEL[b.ageGroup] || "";
  }

  // Kind badge (v7): Issue / Bound volume (a date range, ADR 0013 D4) /
  // Other. Books — and kinds this viewer does not know — render as plain
  // items with no badge (W3).
  function kindBadge(b) {
    if (b.kind === "magazine-issue") {
      return b.issue && b.issue.boundUntil != null
        ? ' <span class="avail avail-kind">Bound volume</span>'
        : ' <span class="avail avail-kind">Issue</span>';
    }
    if (b.kind === "other") return ' <span class="avail avail-kind">Other</span>';
    return "";
  }

  function filterAndSort() {
    const needle = q.value.trim().toLowerCase();
    const sortKey = sortEl.value;
    const languageSel = languageEl.value.toLowerCase();
    const kindSel = kindEl.value;
    let out = books.slice();
    if (kindSel) out = out.filter((b) => (b.kind || "book") === kindSel);
    // v8 "Available now": only items the visitor could borrow right now.
    if (availNowEl.checked) out = out.filter((b) => availabilityTag(b) === "available");
    if (languageSel) out = out.filter((b) => (b.language || "").toLowerCase() === languageSel);
    if (needle) {
      out = out.filter((b) => {
        const t = (b.title || "").toLowerCase();
        const tt = (b.titleTransliteration || "").toLowerCase();
        const a = (b.author || "").toLowerCase();
        const g = (b.genre || "").toLowerCase();
        const i = (b.isbn || "").toLowerCase();
        return t.indexOf(needle) >= 0 || tt.indexOf(needle) >= 0 || a.indexOf(needle) >= 0 ||
               g.indexOf(needle) >= 0 || i.indexOf(needle) >= 0;
      });
    }
    out.sort((a, b) => {
      if (sortKey === "addedDate") {
        return (Number(b.addedDate) || 0) - (Number(a.addedDate) || 0);
      }
      if (sortKey === "ageGroup") {
        // Ordinal order; unset (undefined) sorts last.
        const av = (a.ageGroup in AGE_ORDER) ? AGE_ORDER[a.ageGroup] : 99;
        const bv = (b.ageGroup in AGE_ORDER) ? AGE_ORDER[b.ageGroup] : 99;
        return av - bv;
      }
      // language (or any string key): blanks last, then locale compare.
      const av = (a[sortKey] == null || a[sortKey] === "") ? "\uffff" : String(a[sortKey]);
      const bv = (b[sortKey] == null || b[sortKey] === "") ? "\uffff" : String(b[sortKey]);
      return av.localeCompare(bv);
    });
    return out;
  }

  // W3: an issue belongs under its series. periodicals[] maps uid → series;
  // an issue whose series is absent (removed locally, or an older payload)
  // renders as a plain item — its composed title already names the series.
  // A group stands where the current sort put its first issue; inside the
  // group the newest issue comes first (the app's IssueSorter order: date,
  // then volume, then number, a missing part sorting last).
  function groupIssues(list) {
    const byUid = new Map();
    for (const p of periodicals) {
      if (p && p.periodicalUid) byUid.set(p.periodicalUid, p);
    }
    const groups = new Map(); // uid -> { series, issues }
    const out = []; // [{ item } | { group }] in display order
    for (const b of list) {
      const uid = b && b.kind === "magazine-issue" && b.issue ? b.issue.periodicalUid : null;
      const series = uid ? byUid.get(uid) : undefined;
      if (!series) { out.push({ item: b }); continue; }
      let g = groups.get(uid);
      if (!g) {
        g = { series: series, issues: [] };
        groups.set(uid, g);
        out.push({ group: g });
      }
      g.issues.push(b);
    }
    for (const g of groups.values()) g.issues.sort(cmpIssues);
    return out;
  }

  function cmpIssues(a, b) {
    const x = a.issue || {}, y = b.issue || {};
    const num = (v) => (v == null ? -1 : Number(v) || 0);
    return num(y.issueDate) - num(x.issueDate) ||
           num(y.volume) - num(x.volume) ||
           num(y.issueNumber) - num(x.issueNumber);
  }

  // Series group header content (v7): title plus a little public metadata.
  function seriesLabel(p) {
    const bits = [];
    if (p.publisher) bits.push(escape(p.publisher));
    if (p.issn) bits.push("ISSN " + escape(p.issn));
    return escape(p.title) + (bits.length ? ` <span class="meta">${bits.join(" · ")}</span>` : "");
  }

  function render() {
    if (loadError || !catalogueLoaded) return;
    renderAvailabilitySummary();
    const filtered = filterAndSort();
    meta.textContent = `${filtered.length} of ${books.length} item${books.length === 1 ? "" : "s"}` +
      (newerSchema ? " · This file was created by a newer Pitak. Re-publish from your phone to update the viewer." : "");
    if (filtered.length === 0) {
      root.innerHTML = '<div class="empty">No matches.</div>';
      return;
    }
    const display = groupIssues(filtered);
    root.className = "layout-" + layout;
    if (layout === "table") root.innerHTML = renderTable(display);
    else if (layout === "card") root.innerHTML = renderCards(display);
    else if (layout === "grid") root.innerHTML = renderGrid(display);
  }

  function tableRow(b) {
    return `
      <tr>
        <td>${escape(b.title)}${kindBadge(b)}${availBadge(b)}${b.titleTransliteration ? `<br><span class="meta">${escape(b.titleTransliteration)}</span>` : ""}</td>
        <td>${escape(b.author || "")}</td>
        <td>${escape(ageText(b))}</td>
        <td>${escape(b.publishedYear || "")}</td>
        <td>${escape(b.isbn || "")}</td>
      </tr>
    `;
  }

  function renderTable(display) {
    let rows = "";
    for (const entry of display) {
      if (entry.group) {
        rows += `<tr class="series-row"><td colspan="5">${seriesLabel(entry.group.series)}</td></tr>`;
        rows += entry.group.issues.map(tableRow).join("");
      } else {
        rows += tableRow(entry.item);
      }
    }
    return `
      <table>
        <thead>
          <tr><th>Title</th><th>Author</th><th>Age</th><th>Year</th><th>ISBN</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function cardHtml(b) {
    return `
      <div class="card">
        <h3>${escape(b.title)}${kindBadge(b)}${availBadge(b)}${ageBadge(b)}</h3>
        ${b.titleTransliteration ? `<div class="row">${escape(b.titleTransliteration)}</div>` : ""}
        <div class="author">${escape(b.author || "")}</div>
        <div class="row">
          ${b.publishedYear ? escape(b.publishedYear) + " · " : ""}
          ${b.publisher ? escape(b.publisher) : ""}
        </div>
        <div class="row">${b.isbn ? "ISBN " + escape(b.isbn) : ""}</div>
      </div>
    `;
  }

  function renderCards(display) {
    let html = `<div class="cards">`;
    for (const entry of display) {
      if (entry.group) {
        html += `<h2 class="series-head">${seriesLabel(entry.group.series)}</h2>`;
        html += entry.group.issues.map(cardHtml).join("");
      } else {
        html += cardHtml(entry.item);
      }
    }
    return html + `</div>`;
  }

  function renderGrid(display) {
    // Inline SVG placeholder so we never hit a broken image icon. Sized 2:3
    // book aspect, themed to bg-alt.
    const placeholder = "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 90'>` +
      `<rect width='60' height='90' fill='#fac7a7' fill-opacity='0.25'/>` +
      `<path d='M20 28h20v6H20zM20 38h20v4H20zM20 46h20v4H20zM20 54h12v4H20z' fill='#e25822' fill-opacity='0.6'/>` +
      `</svg>`
    );
    const figureHtml = (b) => `
      <figure>
        <img src="${b.coverUrl ? escape(b.coverUrl) : placeholder}" alt="${escape(b.title)}" loading="lazy" onerror="this.src='${placeholder}'" />
        <figcaption><span class="title">${escape(b.title)}</span>${kindBadge(b)}${availBadge(b)}${ageBadge(b)}</figcaption>
      </figure>
    `;
    let html = `<div class="grid">`;
    for (const entry of display) {
      if (entry.group) {
        html += `<h2 class="series-head">${seriesLabel(entry.group.series)}</h2>`;
        html += entry.group.issues.map(figureHtml).join("");
      } else {
        html += figureHtml(entry.item);
      }
    }
    return html + `</div>`;
  }

  // ---- Start ----
  // v8: books.json and availability.json are requested at the same time.
  // The catalogue renders as soon as books.json arrives; the availability
  // answer re-renders when (and if) it changes anything. Neither waits for
  // the other, and fetchAvailability() turns every network or file problem
  // into a plain answer, so an availability problem can never stop the
  // catalogue.
  load();
  checkAvailability();
  // Re-check once a minute, but only while somebody can see the page: a
  // hidden tab makes no requests at all.
  setInterval(() => {
    if (document.visibilityState === "visible") checkAvailability();
  }, AVAILABILITY_RECHECK_MS);
  // Coming back to the tab re-checks at once instead of waiting for the
  // next minute.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") checkAvailability();
  });
</script>
</body>
</html>
